<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>/*TITLE*/ - Speech to ASL</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F8;--surface:#FFFFFF;--ink:#14202B;--ink-2:#4E5B68;--mute:#7F8B98;--rule:#DCE2E7;--accent:#2F5BD3;
  --plate:#0E3534;--plate-ink:#CFE3DF;--dot:#F2C14E;--live:#C2412D;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

main{display:flex;flex-direction:column;gap:14px;max-width:1180px;min-height:100svh;margin:0 auto;padding:16px}
@media (min-width:900px){main{padding:24px 32px}}

/* top: the mic, a typing fallback, replay */
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#mic{display:flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 18px;border:0;border-radius:26px;background:var(--accent);color:#fff;font-weight:500;font-size:17px}
#mic:hover{background:#2850BC}
#mic svg{width:20px;height:20px;flex:none}
#mic[aria-pressed="true"]{background:var(--live)}
#mic:disabled{background:var(--rule);color:var(--ink-2);cursor:not-allowed}
#say{display:flex;gap:8px;flex:1;min-width:220px}
#text{flex:1;min-width:0;height:44px;padding:0 12px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;font-size:16px}
#text:focus-visible{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.plain{height:44px;padding:0 14px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;font-size:15px}
.plain:hover{border-color:var(--ink-2)}
#status{width:100%;margin:0;font-size:14px;color:var(--ink-2);min-height:1.5em}

/* what was heard, and the ASL order underneath */
.notation{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline;margin:0}
.notation dt{font:12px var(--mono);color:var(--mute)}
.notation dd{margin:0;min-width:0}
#eng{font-size:clamp(22px,3vw,30px);line-height:1.3;letter-spacing:-.01em;min-height:1.3em;overflow-wrap:anywhere}
#eng .live{color:var(--mute)}
.drop{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1.5px}
.moved{color:var(--accent);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px}
#words{display:flex;flex-wrap:wrap;gap:2px 14px;min-height:1.6em;font:16px/1.6 var(--mono)}
#words span{color:var(--mute);transition:color .15s}
#words span.moved{color:#7F9BE4}
#words span.on{color:var(--ink)}
#words span.on.moved{color:var(--accent)}

/* the hands */
#view{position:relative;flex:1;min-height:360px;background:var(--plate);border-radius:6px;overflow:hidden}
#stage{position:absolute;inset:0}
#joints{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#msg{position:absolute;left:14px;bottom:12px;font:13px var(--mono);color:var(--plate-ink)}
.views{position:absolute;top:10px;left:10px;display:flex;border:1px solid rgba(207,227,223,.35);border-radius:4px;margin:0;padding:0}
.views legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.views label{position:relative;display:block}
.views input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.views span{display:block;padding:7px 12px;font:12px/1 var(--mono);color:var(--plate-ink);border-radius:3px}
.views input:checked+span{background:var(--dot);color:var(--plate)}
.views input:focus-visible+span{outline:2px solid var(--dot);outline-offset:1px}
#tones{position:absolute;top:10px;right:10px;display:flex;gap:6px}
#tones .tone{width:24px;height:24px;padding:0;border-radius:50%;border:1px solid rgba(255,255,255,.25)}

nav.site{display:flex;align-items:baseline;gap:18px;font-size:15px}
nav.site b{font-weight:600}
nav.site a{color:var(--ink-2)}
nav.site a:hover{color:var(--ink)}
#credit{margin:0;font-size:12px;color:var(--mute)}
.parts{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main>
  <nav class="site"><b>Signify</b><a href="library.html">Sign library</a></nav>
  <div class="top">
    <button id="mic" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>
      <span id="micLabel">Start listening</span></button>
    <form id="say"><label class="sr" for="text">Or type a sentence</label>
      <input id="text" autocomplete="off" spellcheck="false" placeholder="or type a sentence"><button class="plain">Sign</button></form>
    <button id="replay" class="plain" type="button">Replay</button>
    <p id="status" aria-live="polite"></p>
  </div>

  <dl class="notation">
    <dt>english</dt><dd id="eng" aria-live="polite"></dd>
    <dt>asl</dt><dd id="words"></dd>
  </dl>
  <p id="note" class="sr" aria-live="polite"></p>

  <div id="view">
    <div id="stage" role="img" aria-label="3D hands signing the ASL words above"></div>
    <canvas id="joints" aria-hidden="true"></canvas>
    <fieldset class="views"><legend>Show the hands as</legend>
      <label><input type="radio" name="view" value="hand" checked><span>Hand</span></label>
      <label><input type="radio" name="view" value="joints"><span>Joints</span></label>
      <label><input type="radio" name="view" value="both"><span>Both</span></label>
    </fieldset>
    <span id="tones" role="group" aria-label="Skin tone"></span>
    <div id="msg">Loading the hands...</div>
  </div>

  <p id="credit">Hands: MakeHuman (CC0). Motion: tracked from WLASL sign videos (academic use)<span id="abcCredit" hidden>; letters are authored handshapes</span>. Machine-translated; not checked by a Deaf signer.</p>

  <!-- parts the player script fills in but this page does not show -->
  <div class="parts" aria-hidden="true">
    <button id="play" tabindex="-1"></button><select id="speed" tabindex="-1"><option value="1" selected>1x</option></select>
    <button id="loop" tabindex="-1" aria-pressed="true"></button><div id="lib"></div><div id="presets"></div><div id="abc"></div>
    <input id="find" tabindex="-1"><span id="count"></span><div id="list"></div>
  </div>
</main>

/*ENGINE*/
<script>
// The page around the player: microphone in, the heard sentence with its ASL order, and the joints view.
(()=>{
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const CURLY=new RegExp('['+String.fromCharCode(0x2018,0x2019)+'`]','g');  // curly apostrophes
const norm=s=>s.toUpperCase().replace(CURLY,"'").replace(/[^A-Z0-9' ]+/g,' ').split(/\s+/)
  .map(x=>x.replace(/^'+|'+$/g,'')).filter(Boolean);
const tidy=s=>{if(s===s.toUpperCase())s=s.toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1);};

// Which English words ASL leaves out, and which change place (outside the longest run that keeps its order)
function analyse(text,nlp){
  const g=toGloss(text,LIB,nlp),E=norm(text),st=E.map(()=>({drop:false,asl:-1,moved:false}));
  const dropped={};g.dropped.forEach(w=>dropped[w]=(dropped[w]||0)+1);
  E.forEach((w,j)=>{if(dropped[w]){dropped[w]--;st[j].drop=true;}});
  const signs=[];
  g.items.forEach((x,i)=>{const src=x.spell||x.word||'',en=[];
    src.split(' ').filter(Boolean).forEach(t=>{const j=E.findIndex((w,k)=>w===t&&!st[k].drop&&st[k].asl<0);if(j>=0){st[j].asl=i;en.push(j);}});
    const s={label:x.spell||x.gloss,spell:!!x.spell,added:!src,en};signs.push(s);if(x.rep)signs.push(s);});
  const idx=E.map((_,j)=>j).filter(j=>st[j].asl>=0),a=idx.map(j=>st[j].asl),L=a.map(()=>1),P=a.map(()=>-1);
  for(let i=0;i<a.length;i++)for(let k=0;k<i;k++)if(a[k]<=a[i]&&L[k]+1>L[i]){L[i]=L[k]+1;P[i]=k;}
  let e=-1;L.forEach((v,i)=>{if(e<0||v>=L[e])e=i;});
  const keep=new Set();for(;e>=0;e=P[e])keep.add(idx[e]);
  idx.forEach(j=>{if(!keep.has(j))st[j].moved=true;});
  signs.forEach(s=>s.moved=s.added||s.en.some(j=>st[j].moved));
  return {st,signs};
}
function english(text,A){let j=0;
  return text.trim().split(/\s+/).map(tok=>{const n=norm(tok).length,s=A.st.slice(j,j+n);j+=n;
    const c=!n?'':s.every(x=>x.drop||x.asl<0)?'drop':s.some(x=>x.moved)?'moved':'';
    return c?`<span class="${c}">${esc(tok)}</span>`:esc(tok);}).join(' ');}

let ready=false;
document.addEventListener('signed',({detail:{text,nlp}})=>{
  const A=analyse(text,nlp||null);
  $('eng').innerHTML=english(tidy(text),A);
  [...$('words').children].forEach((sp,i)=>{const s=A.signs[i];if(!s)return;
    sp.textContent=s.spell?'fs-'+s.label:s.label;sp.classList.toggle('moved',s.moved);});
  if(!ready){ready=true;if($('loop').getAttribute('aria-pressed')==='true')$('loop').click();}  // play each sentence once
});

// Sentences heard while the hands are still signing an earlier one wait their turn (the welcome phrase does not)
const queue=[];let spoken=false;
const busy=()=>{const p=window.player;return !p||!p.tl||spoken&&p.t<p.tl.n-1;};
const next=()=>{spoken=true;signText(queue.shift());};
setInterval(()=>{if(ready&&queue.length&&!busy())next();},100);
const heard=s=>{s=s.trim();if(!s)return;queue.push(s);if(ready&&!busy())next();};
$('say').addEventListener('submit',()=>{spoken=false;queue.length=0;});  // typing takes over at once

// Microphone: the browser's speech recognition (Chrome and Edge)
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,mic=$('mic'),status=$('status');
let rec=null,on=false;
function setOn(v){on=v;mic.setAttribute('aria-pressed',v);$('micLabel').textContent=v?'Stop listening':'Start listening';
  status.textContent=v?'Listening. Each sentence is signed when you pause.':'';}
if(!SR){mic.disabled=true;status.textContent='Speech input needs Chrome or Edge. You can still type a sentence.';}
else{
  rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{let live='';
    for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];
      if(r.isFinal)heard(r[0].transcript);else live+=r[0].transcript;}
    if(live.trim())$('eng').innerHTML=`<span class="live">${esc(live.trim())}</span>`;};
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){setOn(false);status.textContent='The microphone is blocked. Allow it from the icon in the address bar, then press Start listening.';}
    else if(e.error==='network'){setOn(false);status.textContent='Speech recognition needs an internet connection. Check it and try again.';}};
  rec.onend=()=>{if(on)try{rec.start();}catch(_){}};  // the browser stops after a long silence; keep going
  mic.onclick=()=>{if(on){setOn(false);rec.stop();}else{setOn(true);try{rec.start();}catch(_){}}};
}

// Joints view: the 21 hand landmarks (wrist, 4 per finger) projected from the rig's bones onto a 2D canvas
const EDGES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
const cv=$('joints'),ctx=cv.getContext('2d');let mode='hand',P=null;
function landmarks(P){const H=P.HAND,JI={};H.names.forEach((n,i)=>JI[n]=i);
  P.hands.forEach(h=>{const b=n=>h.bones[JI[n]];
    const tip=(dip,f)=>{const o=new THREE.Object3D();o.position.fromArray(H.tips[f]).sub(new THREE.Vector3().fromArray(H.joints[JI[dip]]));b(dip).add(o);return o;};
    h.lm=[b('wrist'),b('thumb-cmc'),b('thumb-mcp'),b('thumb-ip'),tip('thumb-ip','thumb')];
    ['index','middle','ring','pinky'].forEach(f=>h.lm.push(b(f+'-mcp'),b(f+'-pip'),b(f+'-dip'),tip(f+'-dip',f)));});}
const v=new THREE.Vector3();
function draw(){const dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,hgt=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(hgt*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(hgt*dpr);}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,hgt);if(mode==='hand')return;
  P.hands.forEach(h=>{const q=h.lm.map(o=>{v.setFromMatrixPosition(o.matrixWorld).project(P.camera);return [(v.x+1)/2*w,(1-v.y)/2*hgt];});
    ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#5E9F96';ctx.beginPath();
    EDGES.forEach(([a,c])=>{ctx.moveTo(q[a][0],q[a][1]);ctx.lineTo(q[c][0],q[c][1]);});ctx.stroke();
    ctx.fillStyle='#F2C14E';ctx.strokeStyle='#0E3534';ctx.lineWidth=1.5;
    q.forEach((p,i)=>{ctx.beginPath();ctx.arc(p[0],p[1],i?3.5:5,0,Math.PI*2);ctx.fill();ctx.stroke();});});}
function setMode(m){mode=m;if(P)P.hands.forEach(h=>h.g.visible=m!=='joints');}
document.querySelectorAll('input[name=view]').forEach(r=>r.onchange=()=>setMode(r.value));
(function wait(){if(!window.player)return requestAnimationFrame(wait);
  P=window.player;landmarks(P);P.scene.onBeforeRender=draw;setMode(document.querySelector('input[name=view]:checked').value);})();
})();
</script>
</body></html>
